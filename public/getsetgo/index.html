<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Portal — Taupō Athletics Club</title>
  <link rel="stylesheet" href="design-tokens.css">
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
</head>
<body>

  <header class="topbar">
    <a class="topbar__brand" href="/" aria-label="Back to homepage">
      <img class="topbar__logo" src="/logo.svg" alt="Taupō Athletics Club logo">
      <span>Taupō Athletics Club</span>
    </a>
    <a class="topbar__back" href="/">← Back to site</a>
  </header>

  <main class="app">
    <!--
      The whole portal is the gated admin area now. The login is the landing
      screen; run sheets, check-in and club records all live behind it as
      sections of the admin dashboard (rendered into #admin-content by
      script.js).
    -->
    <section id="view-admin" class="view">
      <div id="admin-login" class="login-wrap"></div>
      <div id="admin-dashboard" class="admin hidden">
        <aside class="sidenav" id="sidenav"></aside>
        <div id="admin-content"></div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
